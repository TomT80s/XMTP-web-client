<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>XMTP Client (Simple & Reliable)</title>
   <script src="https://cdn.tailwindcss.com"></script>
   
   <style>
       ::-webkit-scrollbar { width: 8px; }
       ::-webkit-scrollbar-track { background: #2d3748; }
       ::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 4px; }
       ::-webkit-scrollbar-thumb:hover { background: #718096; }

       /* Mobile view management */
       .chat-view-container.chat-active > .conversations-list { display: none; }
       .chat-view-container:not(.chat-active) > .chat-area { display: none; }
       
       @media (min-width: 768px) {
           .chat-view-container.chat-active > .conversations-list,
           .chat-view-container:not(.chat-active) > .chat-area { display: flex; }
       }
       
       /* Hide elements using a simple class */
       .hidden { display: none !important; }
   </style>
</head>
<body class="bg-gray-900 text-white font-sans flex flex-col h-screen overflow-hidden">

   <!-- This container will hold the entire app state -->
   <div id="app-container" class="w-full h-full">

       <!-- 1. Disconnected View -->
       <div id="view-disconnected" class="flex flex-col items-center justify-center w-full h-full text-center p-8">
            <header class="absolute top-0 left-0 right-0 bg-gray-800 shadow-md p-4 flex justify-center items-center z-10">
               <h1 class="text-xl font-bold">XMTP Chat Client</h1>
           </header>
           <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-400 mb-4"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.72"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.72"></path></svg>
           <h2 class="text-2xl font-semibold mb-2">Private Web3 Messaging</h2>
           <p class="text-gray-400 mb-6">Connect your wallet to start messaging securely.</p>
           <button id="connect-wallet-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300 flex items-center space-x-2">
               <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4"></path><path d="M14 6l6 6-6 6"></path></svg>
               <span>Connect Wallet</span>
           </button>
       </div>
       
       <!-- 2. Loading View -->
       <div id="view-loading" class="hidden flex flex-col items-center justify-center w-full h-full text-center p-8">
           <svg class="animate-spin h-8 w-8 text-white mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
           <p id="loading-status" class="text-lg text-gray-300">Connecting to wallet...</p>
           <p class="text-sm text-gray-500 mt-2">Please approve the connection in your wallet.</p>
       </div>

       <!-- 3. Connected View -->
       <div id="view-connected" class="hidden flex flex-col h-full">
           <header class="bg-gray-800 shadow-md p-4 flex justify-between items-center z-10 flex-shrink-0">
               <h1 class="text-xl font-bold">Conversations</h1>
               <div class="text-right">
                   <p id="wallet-address" class="text-sm font-mono"></p>
                   <p class="text-xs text-green-400">Connected</p>
               </div>
           </header>
           <div class="chat-view-container flex-grow overflow-hidden flex w-full h-full">
               <!-- Conversations List -->
               <aside class="conversations-list w-full md:w-1/3 bg-gray-800 border-r border-gray-700 flex flex-col h-full">
                   <div class="p-4 flex-shrink-0">
                       <button id="new-conversation-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition duration-300">
                           New Message
                       </button>
                   </div>
                   <div id="conversations-list-container" class="flex-grow overflow-y-auto">
                       <p class="text-gray-400 text-center p-4">Loading conversations...</p>
                   </div>
               </aside>
               <!-- Chat Area -->
               <section class="chat-area w-full md:w-2/3 flex flex-col h-full bg-gray-900">
                   <div id="no-conversation-selected" class="flex flex-col items-center justify-center h-full text-center p-8">
                       <svg xmlns="http://www.w.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-600 mb-4"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                       <h3 class="text-xl font-semibold text-gray-400">Select a conversation</h3>
                       <p class="text-gray-500">Choose a conversation from the list or start a new one.</p>
                   </div>
                   <div id="conversation-container" class="hidden flex-col h-full">
                       <div class="p-4 bg-gray-800 border-b border-gray-700 flex items-center flex-shrink-0">
                            <button id="back-to-conversations" class="md:hidden mr-4 p-2 rounded-full hover:bg-gray-700">
                               <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                           </button>
                           <p class="font-semibold truncate" id="chat-header-address"></p>
                       </div>
                       <div id="messages-container" class="flex-grow p-4 overflow-y-auto"></div>
                       <div class="p-4 bg-gray-800 border-t border-gray-700 flex-shrink-0">
                           <form id="send-message-form" class="flex items-center space-x-3">
                               <input type="text" id="message-input" placeholder="Type your message..." class="flex-grow bg-gray-700 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" autocomplete="off" required>
                               <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-5 rounded-lg transition duration-300">
                                   <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                               </button>
                           </form>
                       </div>
                   </div>
               </section>
           </div>
       </div>
   </div>

   <!-- This single script tag at the end of the body is the modern, correct way to build this. -->
   <script type="module">
       // Import libraries directly from a reliable ESM-focused CDN.
       import { ethers } from 'https://esm.sh/ethers@5';
       import { Client } from 'https://esm.sh/@xmtp/xmtp-js';

       // --- DOM Elements ---
       const views = {
           disconnected: document.getElementById('view-disconnected'),
           loading: document.getElementById('view-loading'),
           connected: document.getElementById('view-connected'),
       };
       const connectWalletBtn = document.getElementById('connect-wallet-btn');
       const loadingStatus = document.getElementById('loading-status');
       const walletAddressSpan = document.getElementById('wallet-address');
       const conversationsListContainer = document.getElementById('conversations-list-container');
       const chatViewContainer = document.querySelector('.chat-view-container');
       const noConversationSelectedDiv = document.getElementById('no-conversation-selected');
       const conversationContainer = document.getElementById('conversation-container');
       const messagesContainer = document.getElementById('messages-container');
       const chatHeaderAddress = document.getElementById('chat-header-address');
       const sendMessageForm = document.getElementById('send-message-form');
       const messageInput = document.getElementById('message-input');
       const newConversationBtn = document.getElementById('new-conversation-btn');
       const backToConversationsBtn = document.getElementById('back-to-conversations');
       
       // --- App State ---
       let signer = null;
       let xmtp = null;
       let currentConversation = null;

       // --- UI Management ---
       function showView(viewId) {
           for (const id in views) {
               views[id].classList.add('hidden');
           }
           views[viewId].classList.remove('hidden');
       }

       // --- Core Logic ---
       async function connectWallet() {
           if (typeof window.ethereum === 'undefined') {
               alert('No web3 wallet detected. Please install a browser extension like MetaMask.');
               return;
           }
           
           showView('loading');
           loadingStatus.textContent = 'Connecting to wallet...';

           try {
               // Request account access
               await window.ethereum.request({ method: 'eth_requestAccounts' });
               
               // Create an ethers provider
               const provider = new ethers.providers.Web3Provider(window.ethereum);
               signer = provider.getSigner();
               const address = await signer.getAddress();
               
               loadingStatus.textContent = 'Initializing XMTP client...';
               // The first time a user connects, they will be prompted to sign a message
               // to create their private key bundle on the XMTP network.
               xmtp = await Client.create(signer, { env: 'production' });

               // Success!
               console.log("Successfully connected and initialized XMTP.", { address, xmtpAddress: xmtp.address });
               walletAddressSpan.textContent = `${address.substring(0, 6)}...${address.substring(address.length - 4)}`;
               showView('connected');
               loadAndStreamConversations();

           } catch (error) {
               console.error("Connection failed:", error);
               alert(`Connection failed: ${error.message}`);
               showView('disconnected');
           }
       }
       
       async function loadAndStreamConversations() {
           if (!xmtp) return;
           conversationsListContainer.innerHTML = '<p class="text-gray-400 text-center p-4">Fetching conversations...</p>';
           
           const allConversations = await xmtp.conversations.list();
           
           if (allConversations.length === 0) {
               conversationsListContainer.innerHTML = '<p class="text-gray-400 text-center p-4">No conversations yet.</p>';
           } else {
               conversationsListContainer.innerHTML = '';
               for (const conv of allConversations) {
                   renderConversation(conv);
               }
           }
           
           // Stream for new conversations
           for await (const conv of await xmtp.conversations.stream()) {
               if (!document.querySelector(`[data-peer-address='${conv.peerAddress}']`)) {
                   renderConversation(conv);
               }
           }
       }

       function renderConversation(conv) {
           const peerAddr = conv.peerAddress;
           const convDiv = document.createElement('div');
           convDiv.dataset.peerAddress = peerAddr;
           convDiv.className = "p-4 border-b border-gray-700 cursor-pointer hover:bg-gray-700 transition duration-200";
           convDiv.innerHTML = `<p class="font-semibold truncate">${peerAddr}</p>`;
           convDiv.onclick = () => selectConversation(conv);
           
           const placeholder = conversationsListContainer.querySelector('p');
           if (placeholder) placeholder.remove();
           
           conversationsListContainer.prepend(convDiv);
       }

       async function selectConversation(conv) {
           currentConversation = conv;
           chatViewContainer.classList.add('chat-active');
           noConversationSelectedDiv.classList.add('hidden');
           conversationContainer.classList.remove('hidden');
           chatHeaderAddress.textContent = conv.peerAddress;
           messagesContainer.innerHTML = '<div class="text-center text-gray-500">Loading messages...</div>';

           document.querySelectorAll('#conversations-list-container > div').forEach(div => {
               div.classList.toggle('bg-indigo-900', div.dataset.peerAddress === conv.peerAddress);
           });

           const messages = await conv.messages();
           messagesContainer.innerHTML = '';
           messages.forEach(renderMessage);
           scrollToBottom();
           streamMessages(conv);
       }
       
       async function streamMessages(conv) {
           for await (const message of await conv.streamMessages()) {
               if (currentConversation && conv.peerAddress === currentConversation.peerAddress) {
                   renderMessage(message);
                   scrollToBottom();
               }
           }
       }

       function renderMessage(message) {
           const isSender = message.senderAddress === xmtp.address;
           const msgDiv = document.createElement('div');
           msgDiv.className = `flex mb-4 ${isSender ? 'justify-end' : 'justify-start'}`;
           const contentDiv = document.createElement('div');
           contentDiv.className = `max-w-md rounded-lg px-4 py-2 break-words ${isSender ? 'bg-indigo-600' : 'bg-gray-700'}`;
           contentDiv.textContent = message.content;
           msgDiv.appendChild(contentDiv);
           messagesContainer.appendChild(msgDiv);
       }

       async function sendMessage(e) {
           e.preventDefault();
           const message = messageInput.value.trim();
           if (!message || !currentConversation) return;
           
           await currentConversation.send(message);
           messageInput.value = '';
       }

       async function handleNewConversation() {
           const recipientAddress = prompt("Enter the Ethereum address of the recipient:");
           if (!recipientAddress) return;

           if (!ethers.utils.isAddress(recipientAddress)) {
               alert("Invalid Ethereum address.");
               return;
           }
           if(recipientAddress.toLowerCase() === xmtp.address.toLowerCase()){
                alert("You cannot start a conversation with yourself.");
                return;
           }

           try {
               const canMessage = await xmtp.canMessage(recipientAddress);
               if (!canMessage) {
                   alert("This address isn't on the XMTP network yet. They must connect to an XMTP app once to activate their identity.");
                   return;
               }
               const newConv = await xmtp.conversations.newConversation(recipientAddress);
               if (!document.querySelector(`[data-peer-address='${recipientAddress}']`)) {
                   renderConversation(newConv);
               }
               selectConversation(newConv);
           } catch (error) {
               console.error("Failed to create conversation:", error);
               alert(`Could not start conversation: ${error.message}`);
           }
       }

       function showConversationList() {
           chatViewContainer.classList.remove('chat-active');
       }

       function scrollToBottom() {
           messagesContainer.scrollTop = messagesContainer.scrollHeight;
       }

       // --- Attach Event Listeners ---
       connectWalletBtn.addEventListener('click', connectWallet);
       sendMessageForm.addEventListener('submit', sendMessage);
       newConversationBtn.addEventListener('click', handleNewConversation);
       backToConversationsBtn.addEventListener('click', showConversationList);
       
       // --- Initial Check ---
       // This makes sure the app starts in the correct state.
       showView('disconnected');
   </script>
</body>
</html>
